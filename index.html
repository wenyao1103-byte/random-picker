# random-picker
<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>隨機抽選系統 - 專業版</title>
    <style>
        body {
            font-family: -apple-system, system-ui, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box;
        }
        .container {
            background: white; padding: 40px; border-radius: 30px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.1); text-align: center;
            width: 100%; max-width: 320px;
        }
        #number-display { font-size: 80px; font-weight: 800; color: #007AFF; margin: 20px 0; }
        button {
            background: #007AFF; color: white; border: none; padding: 15px;
            font-size: 1.1rem; border-radius: 15px; cursor: pointer; width: 100%;
            transition: transform 0.1s;
        }
        button:active { transform: scale(0.98); }
        .photo-frame {
            margin-top: 25px; width: 100%; background: #eee;
            border-radius: 15px; overflow: hidden; display: flex;
            align-items: center; justify-content: center; min-height: 250px;
        }
        img {
            width: 100%; height: auto;
            object-fit: contain; /* 確保圖片不被裁切，完整呈現 */
            max-height: 400px; display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>隨機抽選系統</h2>
        <div id="number-display">?</div>
        <button onclick="startDraw()">開始抽選</button>
        <div class="photo-frame">
            <span id="placeholder" style="color: #999;">等待抽獎...</span>
            <img id="main-photo" src="">
        </div>
    </div>

<script>
    // ===== 設定區 =====
    const totalImages = 9;

    // 建立「尚未抽過」的清單
    let remainingNumbers = Array.from(
        { length: totalImages },
        (_, i) => i + 1
    );

    function startDraw() {
        const numDisplay = document.getElementById('number-display');
        const photo = document.getElementById('main-photo');
        const placeholder = document.getElementById('placeholder');

        // 如果已經抽完
        if (remainingNumbers.length === 0) {
            placeholder.style.display = 'block';
            placeholder.innerText = "🎉 已全部抽完";
            photo.style.display = 'none';
            numDisplay.innerText = "✓";
            return;
        }

        // 從剩餘清單中隨機選一個 index
        const randomIndex = Math.floor(Math.random() * remainingNumbers.length);
        const result = remainingNumbers[randomIndex];

        // 把抽到的數字從清單移除
        remainingNumbers.splice(randomIndex, 1);

        numDisplay.innerText = result;

        const imageUrl =
            `https://raw.githubusercontent.com/wenyao1103-byte/web-assets1/main/${result}.png?v=${Date.now()}`;

        photo.style.display = 'none';
        placeholder.style.display = 'block';
        placeholder.innerText = "載入中...";
        photo.src = imageUrl;

        photo.onload = () => {
            placeholder.style.display = 'none';
            photo.style.display = 'block';
        };

        photo.onerror = () => {
            placeholder.style.display = 'block';
            placeholder.innerText = "讀取失敗，請檢查檔名";
            photo.style.display = 'none';
        };
    }
</script>
</body>
</html>

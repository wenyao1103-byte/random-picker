# random-picker
<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>隨機抽選系統 - 專業版</title>
    <style>
        body {
            font-family: -apple-system, system-ui, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box;
        }
        .container {
            background: white; padding: 40px; border-radius: 30px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.1); text-align: center;
            width: 100%; max-width: 320px;
        }
        #number-display { font-size: 80px; font-weight: 800; color: #007AFF; margin: 20px 0; }
        button {
            background: #007AFF; color: white; border: none; padding: 15px;
            font-size: 1.1rem; border-radius: 15px; cursor: pointer; width: 100%;
            transition: transform 0.1s;
        }
        button:active { transform: scale(0.98); }
        .photo-frame {
            margin-top: 25px; width: 100%; background: #eee;
            border-radius: 15px; overflow: hidden; display: flex;
            align-items: center; justify-content: center; min-height: 250px;
        }
        img {
            width: 100%; height: auto;
            object-fit: contain; /* 確保圖片不被裁切，完整呈現 */
            max-height: 400px; display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>隨機抽選系統</h2>
        <div id="number-display">?</div>
        <button onclick="startDraw()">開始抽選</button>
        <div class="photo-frame">
            <span id="placeholder" style="color: #999;">等待抽獎...</span>
            <img id="main-photo" src="">
        </div>
    </div>

    <script>
        function startDraw() {
            const numDisplay = document.getElementById('number-display');
            const photo = document.getElementById('main-photo');
            const placeholder = document.getElementById('placeholder');
            
            // 根據你 web-assets1 的圖片數量，這裡建議設定為 8
            const totalImages = 8; 
            const result = Math.floor(Math.random() * totalImages) + 1;
            numDisplay.innerText = result;

            // 更新為你的新儲存庫 web-assets1
            const imageUrl = `https://raw.githubusercontent.com/wenyao1103-byte/web-assets1/main/${result}.png`;

            photo.style.display = 'none';
            placeholder.style.display = 'block';
            placeholder.innerText = "載入中...";
            photo.src = imageUrl;

            photo.onload = () => {
                placeholder.style.display = 'none';
                photo.style.display = 'block';
            };

            photo.onerror = () => {
                placeholder.style.display = 'block';
                placeholder.innerText = "讀取失敗，請檢查檔名";
                photo.style.display = 'none';
            };
        }
    </script>
</body>
</html>
